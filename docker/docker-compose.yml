services:

  actinia-ogc-api-processes:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # -- For dev-setup and/or tests mount plugin src code:
    # volumes:
    #  - ..:/src/actinia-ogc-api-processes-plugin/.
    cap_add:
      - SYS_PTRACE
    ports:
      - "4044:4044"
    # -- For dev-setup/debugging uncomment following:
    # network_mode: "host"
    # stdin_open: true
    # tty: true
    # command: >
    #  sh -c "python -m actinia_ogc_api_processes_plugin.main --workers 1 --timeout 3600 --bind 0.0.0.0:4044"


  actinia-core:
    image: mundialis/actinia:2.17.6
    volumes:
      - ./actinia-data/resources/actinia-gdi/resource_id-8c88e3aa-3ba2-4050-9c2f-b3ad0a60f880:/actinia_core/resources/actinia-gdi/resource_id-8c88e3aa-3ba2-4050-9c2f-b3ad0a60f880:ro
    # ports:
    #  - "8088:8088"
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/api/v3/version', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    volumes:
      - ./valkey_data:/data
    image: valkey/valkey:9.2-alpine
    command: [
      "sh",
      "-c",
      'docker-entrypoint.sh
      --requirepass pass'
    ]
